<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal | Favze</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --ink: #1a1f2e;
    --slate: #64748b;
    --line: #e2e8f0;
    --paper: #f8fafc;
    --bg: #ffffff;
    --teal: #0f766e;
    --teal-light: #ccfbf1;
    --red: #dc2626;
    --red-light: #fee2e2;
    --navy: #04305f;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }

  .header { background: var(--navy); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  .header svg { width: 28px; height: 28px; }
  .header-brand { color: #fff; font-weight: 800; font-size: 18px; letter-spacing: -0.3px; }

  .container { max-width: 780px; margin: 0 auto; padding: 32px 20px 80px; }

  .state-loading, .state-error, .state-signed, .state-declined { text-align: center; padding: 60px 20px; }
  .state-icon { font-size: 48px; margin-bottom: 16px; }
  .state-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .state-sub { color: var(--slate); font-size: 15px; line-height: 1.6; }

  /* Proposal meta header */
  .proposal-meta { background: var(--navy); color: #fff; border-radius: var(--radius); padding: 24px 28px; margin-bottom: 24px; }
  .proposal-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  .proposal-meta-row { display: flex; gap: 24px; flex-wrap: wrap; font-size: 13px; opacity: 0.85; }
  .proposal-meta-row span { display: flex; align-items: center; gap: 5px; }

  /* PDF viewer */
  .pdf-viewer-wrap { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 24px; }
  .pdf-viewer-wrap h3 { font-size: 14px; font-weight: 700; color: var(--slate); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
  #pdf-canvas-wrap { overflow: auto; max-height: 600px; border: 1px solid var(--line); border-radius: 6px; background: #525659; }
  #pdf-canvas-wrap canvas { display: block; margin: 0 auto; }
  .pdf-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 12px; font-size: 13px; color: var(--slate); }
  .pdf-nav button { padding: 5px 14px; border: 1.5px solid var(--line); background: var(--bg); border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .pdf-nav button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* HTML body content */
  .proposal-body { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 32px; margin-bottom: 24px; line-height: 1.7; font-size: 15px; }
  .proposal-body h1, .proposal-body h2, .proposal-body h3 { margin: 1.2em 0 0.5em; font-weight: 700; }
  .proposal-body p { margin-bottom: 1em; }
  .proposal-body ul, .proposal-body ol { margin: 0.5em 0 1em 1.5em; }
  .proposal-body li { margin-bottom: 0.4em; }
  .proposal-body table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  .proposal-body table th, .proposal-body table td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
  .proposal-body table th { background: var(--paper); font-weight: 600; }

  /* Sign box */
  .sign-box { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 32px; }
  .sign-box h2 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .sign-box > p { color: var(--slate); font-size: 13.5px; margin-bottom: 20px; line-height: 1.5; }

  .sign-field { margin-bottom: 16px; }
  .sign-field label { display: block; font-size: 12px; font-weight: 700; color: var(--slate); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .sign-field input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.15s; }
  .sign-field input:focus { border-color: var(--navy); }

  /* Signature method tabs */
  .sig-tabs { display: flex; gap: 0; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
  .sig-tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--paper); color: var(--slate); border: none; transition: background 0.15s, color 0.15s; }
  .sig-tab.active { background: var(--navy); color: #fff; }

  /* Typed signature */
  #sig-type-wrap .sig-input { width: 100%; padding: 14px; border: 1.5px solid var(--line); border-radius: 8px; font-family: Georgia, 'Times New Roman', serif; font-size: 24px; font-style: italic; color: var(--navy); outline: none; transition: border-color 0.15s; }
  #sig-type-wrap .sig-input:focus { border-color: var(--navy); }

  /* Draw signature */
  #sig-draw-wrap { display: none; }
  #sig-canvas-container { position: relative; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; cursor: crosshair; }
  #sig-canvas { display: block; width: 100%; height: 160px; touch-action: none; }
  .sig-draw-hint { font-size: 11.5px; color: var(--slate); margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
  .sig-clear-btn { font-size: 12px; font-weight: 600; color: var(--red); background: none; border: none; cursor: pointer; padding: 2px 0; }

  .btn-sign { width: 100%; padding: 15px; background: var(--teal); color: #fff; border: none; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
  .btn-sign:hover { background: #0d6660; }
  .btn-sign:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn-decline { width: 100%; padding: 11px; background: none; color: var(--slate); border: 1.5px solid var(--line); border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: all 0.15s; }
  .btn-decline:hover { border-color: var(--red); color: var(--red); }

  .legal-note { font-size: 11.5px; color: var(--slate); margin-top: 16px; line-height: 1.5; text-align: center; }

  .progress-wrap { margin-top: 12px; display: none; }
  .progress-bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--teal); transition: width 0.3s; }
  .progress-label { font-size: 11px; color: var(--slate); margin-top: 4px; text-align: center; }

  @media(max-width:600px){
    .proposal-body, .sign-box, .pdf-viewer-wrap { padding: 20px 18px; }
    .proposal-meta { padding: 18px 20px; }
  }
</style>
</head>
<body>
<div class="header">
  <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="300" fill="#04305f" rx="40"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="180" font-family="Arial">F</text></svg>
  <span class="header-brand">Favze</span>
</div>

<div class="container">
  <div id="app-state" class="state-loading">
    <div class="state-icon">⏳</div>
    <div class="state-title">Loading proposal...</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ozbhlqgytfyjdgkoyhkt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_35rPBJVeCiEETVdBP0dLlw_OmpU77Vd';

// pdf.js worker
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function sbFetch(path, opts = {}){
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...opts,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...(opts.headers || {})
    }
  });
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }

const params = new URLSearchParams(location.search);
const proposalId = params.get('id');
const app = document.getElementById('app-state');

// PDF state
let pdfDoc = null, pdfPage = 1, pdfTotal = 0;

async function init(){
  if(!proposalId){
    showError('No proposal ID in this link. Check the link you received and try again.');
    return;
  }
  try{
    const res = await sbFetch(`proposals?id=eq.${proposalId}&select=id,title,prospect_name,prospect_email,body_html,status,signed_at,signed_name,created_at,document_url`);
    if(!res.ok) throw new Error('fetch failed');
    const rows = await res.json();
    if(!rows.length){ showError('Proposal not found. It may have been deleted or the link may be incorrect.'); return; }
    const p = rows[0];
    if(p.status === 'signed'){ showSigned(p); return; }
    if(p.status === 'declined'){ showDeclined(p); return; }
    renderProposal(p);
  }catch(e){
    console.error(e);
    showError('Could not load the proposal. Please try again or contact Favze Digital.');
  }
}

function showError(msg){
  app.innerHTML = `<div class="state-icon">&#9888;&#65039;</div><div class="state-title">Something went wrong</div><div class="state-sub">${esc(msg)}</div>`;
}

function showSigned(p){
  app.innerHTML = `<div class="state-icon">&#9989;</div><div class="state-title">Proposal already signed</div><div class="state-sub">This proposal was signed by <strong>${esc(p.signed_name||p.prospect_name)}</strong> on ${fmtDate(p.signed_at)}. No further action needed.</div>`;
}

function showDeclined(p){
  app.innerHTML = `<div class="state-icon">&#128683;</div><div class="state-title">Proposal declined</div><div class="state-sub">This proposal was previously declined. Reach out to Favze Digital if you have questions.</div>`;
}

function renderProposal(p){
  app.className = '';

  const docSection = p.document_url ? `
    <div class="pdf-viewer-wrap" id="pdf-section">
      <h3>Document</h3>
      <div id="pdf-canvas-wrap"><canvas id="pdf-canvas"></canvas></div>
      <div class="pdf-nav">
        <button id="pdf-prev" onclick="pdfChangePage(-1)" disabled>&#8592; Prev</button>
        <span id="pdf-page-label">Page 1 of ?</span>
        <button id="pdf-next" onclick="pdfChangePage(1)">Next &#8594;</button>
      </div>
    </div>` : '';

  const bodySection = p.body_html ? `<div class="proposal-body">${p.body_html}</div>` : '';

  app.innerHTML = `
    <div class="proposal-meta">
      <div class="proposal-title">${esc(p.title)}</div>
      <div class="proposal-meta-row">
        <span>&#128203; Prepared for ${esc(p.prospect_name)}</span>
        <span>&#128197; ${fmtDate(p.created_at)}</span>
      </div>
    </div>
    ${docSection}
    ${bodySection}
    <div class="sign-box">
      <h2>Sign this proposal</h2>
      <p>By signing, you confirm you have read and agree to the terms outlined above. This signature is legally binding.</p>
      <div class="sign-field">
        <label>Your full name</label>
        <input type="text" id="sig-name" placeholder="${esc(p.prospect_name)}" autocomplete="name">
      </div>
      <div class="sign-field">
        <label>Your email</label>
        <input type="email" id="sig-email" value="${esc(p.prospect_email||'')}" placeholder="your@email.com">
      </div>
      <div class="sign-field">
        <label>Signature</label>
        <div class="sig-tabs">
          <button class="sig-tab active" id="tab-type" onclick="switchSigMode('type')">Type</button>
          <button class="sig-tab" id="tab-draw" onclick="switchSigMode('draw')">Draw</button>
        </div>
        <div id="sig-type-wrap">
          <input type="text" class="sig-input" id="sig-typed" placeholder="Type your name as your signature">
        </div>
        <div id="sig-draw-wrap">
          <div id="sig-canvas-container">
            <canvas id="sig-canvas"></canvas>
          </div>
          <div class="sig-draw-hint">
            <span>Draw your signature above</span>
            <button class="sig-clear-btn" onclick="clearCanvas()">Clear</button>
          </div>
        </div>
      </div>
      <button class="btn-sign" id="btn-sign" onclick="submitSignature('${esc(p.id)}','${esc(p.prospect_name)}')">Sign and Accept Proposal</button>
      <button class="btn-decline" onclick="declineProposal('${esc(p.id)}')">Decline this proposal</button>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-label" id="progress-label">Saving signature...</div>
      </div>
      <div class="legal-note">This electronic signature is legally binding under applicable e-signature laws. Your signature, timestamp, and identifying information are recorded securely.</div>
    </div>
  `;

  if(p.document_url) loadPDF(p.document_url);
  initCanvas();
}

// PDF viewer
async function loadPDF(url){
  try{
    if(!window.pdfjsLib){ console.warn('pdf.js not loaded'); return; }
    const task = pdfjsLib.getDocument({ url, withCredentials: false });
    pdfDoc = await task.promise;
    pdfTotal = pdfDoc.numPages;
    pdfPage = 1;
    renderPDFPage(1);
  }catch(e){ console.error('PDF load error', e); }
}

async function renderPDFPage(num){
  if(!pdfDoc) return;
  const page = await pdfDoc.getPage(num);
  const wrap = document.getElementById('pdf-canvas-wrap');
  const canvas = document.getElementById('pdf-canvas');
  if(!canvas || !wrap) return;
  const viewport = page.getViewport({ scale: Math.min(2, (wrap.clientWidth - 20) / page.getViewport({scale:1}).width) });
  canvas.height = viewport.height;
  canvas.width = viewport.width;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  document.getElementById('pdf-page-label').textContent = `Page ${num} of ${pdfTotal}`;
  document.getElementById('pdf-prev').disabled = num <= 1;
  document.getElementById('pdf-next').disabled = num >= pdfTotal;
}

function pdfChangePage(delta){
  const next = pdfPage + delta;
  if(next < 1 || next > pdfTotal) return;
  pdfPage = next;
  renderPDFPage(pdfPage);
}

// Signature mode switching
var sigMode = 'type';
function switchSigMode(mode){
  sigMode = mode;
  document.getElementById('tab-type').classList.toggle('active', mode==='type');
  document.getElementById('tab-draw').classList.toggle('active', mode==='draw');
  document.getElementById('sig-type-wrap').style.display = mode==='type' ? '' : 'none';
  document.getElementById('sig-draw-wrap').style.display = mode==='draw' ? 'block' : 'none';
  if(mode==='draw') resizeCanvas();
}

// Draw canvas
var isDrawing = false, lastX = 0, lastY = 0, hasDrawn = false;
function initCanvas(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  resizeCanvas();
  function getPos(e){
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * (canvas.width / r.width), y: (src.clientY - r.top) * (canvas.height / r.height) };
  }
  function start(e){ e.preventDefault(); isDrawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; }
  function move(e){ e.preventDefault(); if(!isDrawing) return; const p = getPos(e); draw(lastX, lastY, p.x, p.y); lastX = p.x; lastY = p.y; hasDrawn = true; }
  function end(){ isDrawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}

function resizeCanvas(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  const container = document.getElementById('sig-canvas-container');
  if(!container) return;
  const w = container.clientWidth || 400;
  canvas.width = w * window.devicePixelRatio;
  canvas.height = 160 * window.devicePixelRatio;
  canvas.style.width = w + 'px';
  canvas.style.height = '160px';
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  ctx.strokeStyle = '#04305f';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

function draw(x1, y1, x2, y2){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function clearCanvas(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hasDrawn = false;
}

function getSignatureData(){
  if(sigMode === 'type'){
    const val = (document.getElementById('sig-typed')||{}).value || '';
    return { type: 'typed', value: val.trim(), dataUrl: null };
  } else {
    const canvas = document.getElementById('sig-canvas');
    return { type: 'drawn', value: null, dataUrl: canvas ? canvas.toDataURL('image/png') : null };
  }
}

function setProgress(pct, label){
  const wrap = document.getElementById('progress-wrap');
  const fill = document.getElementById('progress-fill');
  const lbl = document.getElementById('progress-label');
  if(wrap) wrap.style.display = 'block';
  if(fill) fill.style.width = pct + '%';
  if(lbl) lbl.textContent = label;
}

async function submitSignature(id, prospectName){
  const name = (document.getElementById('sig-name').value||'').trim() || prospectName;
  const email = (document.getElementById('sig-email').value||'').trim();
  const sig = getSignatureData();

  if(sigMode==='type' && !sig.value){ alert('Please type your name as your signature.'); return; }
  if(sigMode==='draw' && !hasDrawn){ alert('Please draw your signature in the box.'); return; }
  if(!email){ alert('Please enter your email address.'); return; }

  const btn = document.getElementById('btn-sign');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  setProgress(20, 'Saving signature...');

  try{
    // Upload drawn signature image to storage if applicable
    let sigImageUrl = null;
    if(sig.type === 'drawn' && sig.dataUrl){
      setProgress(40, 'Uploading signature...');
      try{
        const blob = await (await fetch(sig.dataUrl)).blob();
        const filename = `signatures/${id}_${Date.now()}.png`;
        const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/proposal-docs/${filename}`, {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'image/png', 'x-upsert': 'true' },
          body: blob
        });
        if(uploadRes.ok){
          const uploadData = await uploadRes.json();
          sigImageUrl = `${SUPABASE_URL}/storage/v1/object/public/proposal-docs/${filename}`;
        }
      }catch(uploadErr){ console.warn('Signature image upload failed (non-fatal):', uploadErr); }
    }

    setProgress(70, 'Recording your acceptance...');

    const payload = {
      status: 'signed',
      signed_name: name,
      signed_at: new Date().toISOString(),
      signature_data: JSON.stringify({
        method: sig.type,
        typed_signature: sig.type==='typed' ? sig.value : null,
        signature_image_url: sigImageUrl,
        email,
        timestamp: new Date().toISOString(),
        user_agent: navigator.userAgent,
        ip_hint: null
      })
    };

    const res = await sbFetch(`proposals?id=eq.${id}`, {
      method: 'PATCH',
      prefer: 'return=minimal',
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('patch failed');

    setProgress(90, 'Notifying your agency...');

    // Notify agency
    try{
      await fetch(SUPABASE_URL + '/functions/v1/portal-notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY },
        body: JSON.stringify({ action: 'proposal-signed', prospectName: name, prospectEmail: email, proposalId: id })
      });
    }catch(notifyErr){ console.warn('Notify failed (non-fatal):', notifyErr); }

    setProgress(100, 'Done!');
    setTimeout(()=>{
      app.innerHTML = `
        <div class="state-icon">&#127881;</div>
        <div class="state-title">Proposal signed!</div>
        <div class="state-sub">Thank you, <strong>${esc(name)}</strong>. We received your signature and will be in touch shortly to get started. Keep an eye on your inbox for next steps from the Favze team.</div>
      `;
    }, 400);
  }catch(e){
    console.error(e);
    btn.disabled = false;
    btn.textContent = 'Sign and Accept Proposal';
    document.getElementById('progress-wrap').style.display = 'none';
    alert('Could not save your signature. Please try again or contact Favze Digital directly.');
  }
}

async function declineProposal(id){
  if(!confirm('Are you sure you want to decline this proposal?')) return;
  try{
    await sbFetch(`proposals?id=eq.${id}`, { method: 'PATCH', prefer: 'return=minimal', body: JSON.stringify({ status: 'declined' }) });
    app.innerHTML = `<div class="state-icon">&#128075;</div><div class="state-title">Proposal declined</div><div class="state-sub">We've recorded your decision. If you'd like to revisit or discuss options, reach out to us at any time.</div>`;
  }catch(e){
    alert('Could not update status. Please try again.');
  }
}

init();
</script>
</body>
</html>
